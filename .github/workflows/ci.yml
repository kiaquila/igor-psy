name: Project CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Check PR diff whitespace
        if: github.event_name == 'pull_request'
        run: git diff --check HEAD^ HEAD
      - run: sh scripts/preflight.sh
      - name: OSV scan of locked npm dependencies
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: --lockfile=package-lock.json
      - name: Install locked deployment tooling
        run: npm ci --ignore-scripts
      - name: Validate Cloudflare deployment configuration
        run: npm exec --no -- wrangler deploy --dry-run
        env:
          WRANGLER_SEND_METRICS: 'false'
